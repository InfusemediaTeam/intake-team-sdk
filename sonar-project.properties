sonar.sources=.
sonar.sourceEncoding=UTF-8

# Tests are declared as tests, so test rules run on them and production rules
# do not. tests/** is also listed in sonar.exclusions below only because that
# property applies to main sources, and Sonar needs the main and test sets to be
# disjoint; the files are still analysed, as tests.
sonar.tests=tests

# Vendored, generated and test code, which nobody is scored on.
sonar.exclusions=\
  **/node_modules/**,\
  **/.venv/**,\
  **/dist/**,\
  **/dist-test/**,\
  **/build/**,\
  **/vendor/**,\
  **/migrations/**,\
  **/*.min.js,\
  coverage-reports/**,\
  tests/**
