name: CI

# Checks only: nothing here builds a release, publishes a package or pushes a
# tag. Consumers install from Git tags, so a tag is only cut once this passes.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  javascript:
    name: JavaScript SDK
    runs-on: ubuntu-latest

    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'

      - name: Install dependencies
        # `prepare` builds the package; that build is checked again below.
        run: npm ci

      - name: Generated contract code is current
        run: npm run check:generated

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

  python:
    name: Python SDK (${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.13']

    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install the package
        run: python -m pip install ./packages/python

      - name: Test
        # The suite reads the shared fixtures in ../../spec, so it runs from the
        # checkout rather than from the installed package alone.
        working-directory: packages/python
        run: python -m unittest discover -s tests
